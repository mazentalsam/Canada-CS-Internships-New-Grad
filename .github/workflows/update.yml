name: Update listings
on:
  schedule: [{ cron: "15 * * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL -A "Mozilla/5.0" https://csjobs.ca/feeds/canada-internships.md -o README.md
      - run: |
          git config user.name "csjobs-bot"
          git config user.email "contact@csjobs.ca"
          git add README.md
          git commit -m "Update listings" && git push || true
